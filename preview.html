<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM 출결 — 모바일 미리보기</title>
<style>
  html,body{margin:0;height:100%;background:#e9edf3;font-family:system-ui,sans-serif}
  body{display:grid;place-items:center}
  .phone{width:390px;height:844px;border-radius:44px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.28);overflow:hidden;position:relative}
  iframe{display:block;width:390px;height:844px;border:0}
  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;font-size:12px;color:#64748b}
</style>
</head>
<body>
  <div class="phone"><iframe id="f" title="RM 출결 미리보기"></iframe></div>
  <div class="hint">390 × 844 · iPhone 14 크기</div>
  <script>
    // The token comes from this page's own hash, so it never reaches the server.
    document.getElementById('f').src = './' + location.hash;
  </script>
</body>
</html>
